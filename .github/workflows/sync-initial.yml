name: Sync Worker (initial)

# Started on demand by the API (workflow_dispatch) as soon as a initial sync job
# is queued; the schedule is only a fallback for failed or missing dispatches.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

# One drain per lane at a time. Never cancel-in-progress: killing a drain
# mid-job leaves that job "running" until a later run's reaper requeues it,
# costing it an attempt.
concurrency:
  group: sync-initial
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # A 180-day initial import of a ~6,500-message mailbox took ~75 min at the
    # Phase 8 rate; the drain's own 100-minute budget exits cleanly first. A
    # single job still can't be paused mid-way (time-slicing is deferred).
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${{ secrets.PROD_GMAIL_TOKEN_ENCRYPTION_KEY }}
      SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
      CORS_ORIGINS: https://job-tracker-1-ldy2.onrender.com
      FRONTEND_URL: https://job-tracker-1-ldy2.onrender.com
      ENV: production
      COOKIE_SECURE: "true"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Drain sync queue
        working-directory: backend
        run: uv run python -m app.sync.drain --lane initial
