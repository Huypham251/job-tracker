name: Sync Worker (incremental)

# Started on demand by the API (workflow_dispatch) as soon as a incremental sync job
# is queued; the schedule is only a fallback for failed or missing dispatches.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  # Only for the last step: a run whose job hit its slice deadline dispatches
  # this workflow again to continue it (Phase 10).
  actions: write

# One drain per lane at a time — the next run's orphan sweep relies on it
# (a "running" job in this lane at drain start was abandoned). Never
# cancel-in-progress: killing a drain mid-job costs that job an attempt.
concurrency:
  group: sync-incremental
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    # One 20-minute slice (below) plus at most one page and setup. A longer
    # catch-up pauses at the slice deadline and continues in a new run.
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.PROD_GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.PROD_GOOGLE_CLIENT_SECRET }}
      GMAIL_TOKEN_ENCRYPTION_KEY: ${{ secrets.PROD_GMAIL_TOKEN_ENCRYPTION_KEY }}
      SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
      CORS_ORIGINS: https://job-tracker-1-ldy2.onrender.com
      FRONTEND_URL: https://job-tracker-1-ldy2.onrender.com
      ENV: production
      COOKIE_SECURE: "true"
      # Override without a commit via the repo variable of the same name (drills).
      SYNC_INCREMENTAL_SLICE_SECONDS: ${{ vars.SYNC_INCREMENTAL_SLICE_SECONDS || '1200' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked

      - name: Drain sync queue
        id: drain
        working-directory: backend
        run: uv run python -m app.sync.drain --lane incremental

      # A job that reached its slice deadline was checkpointed and requeued
      # without using an attempt — start the next slice now instead of
      # waiting for the throttled cron. A workflow_dispatch sent with
      # GITHUB_TOKEN does create a run; concurrency queues it behind this one.
      - name: Continue a paused job in a new run
        if: steps.drain.outputs.requeued == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync-incremental.yml --ref main --repo ${{ github.repository }}
